name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Static checks
        run: >-
          python -m ruff check
          predictx/state_aware_endpoints.py
          predictx/gate_deferral_recovery_f.py
          predictx/gate_r3_ats_besttest_f.py
          tests
          tools/evaluate_physics_informed_selector.py
          tools/run_frozen_cross_cycle_validation.py
      - name: Tests
        run: python -m pytest -q
      - name: Bytecode compilation
        run: python -m compileall -q predictx tests tools
