name: quality

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Static checks
        run: python -m ruff check predictx tests
      - name: Tests
        run: python -m pytest -q
      - name: Bytecode compilation
        run: python -m compileall -q predictx tests
